name: Publish Retro TV desktop webpage

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'mobile/**'
      - 'lib/**'
      - 'scripts/build-mobile.js'
      - 'scripts/build-web.js'
      - 'web/**'
      - 'channels.json'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: retro-tv-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build from PC Retro TV source
        run: node scripts/build-web.js
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist-web
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
